services:
  panel:
    build: .
    restart: unless-stopped
    expose:
      - "8000"
    environment:
      SECRET_KEY: ${SECRET_KEY:-change-me}
      OWNER_PASSWORD: ${OWNER_PASSWORD:-owner123}
      CASHIER_PASSWORD: ${CASHIER_PASSWORD:-cashier123}
      SYRIAN_RATE_API_URL: ${SYRIAN_RATE_API_URL:-https://aumzkcizwfnvnncggfpq.supabase.co/functions/v1/exchange-rates}
      SYRIAN_RATE_API_KEY: ${SYRIAN_RATE_API_KEY:-}
    volumes:
      - panel_data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 40s

volumes:
  panel_data: