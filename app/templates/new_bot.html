{% extends "base.html" %}
{% block title %}بوت جديد{% endblock %}
{% block body %}
<div class="top">
  <div>
    <p class="kicker">New bot</p>
    <h1>إنشاء بوت</h1>
  </div>
</div>
{% if error %}<p class="err">{{ error }}</p>{% endif %}
<form method="post">
  <div class="card">
    <label>اسم البوت</label>
    <input name="name" required>
    <label>Bot token</label>
    <input name="token" required>
    <label>اسم الكاشير</label>
    <input name="cashier_user" placeholder="اتركه فارغاً للتوليد">
    <label>كلمة مرور الكاشير</label>
    <input name="cashier_pass" type="password">
    <label class="check"><input type="checkbox" name="generate" value="1"> توليد كاشير تلقائي</label>
  </div>
  <button type="submit">إنشاء</button>
</form>
{% endblock %}
