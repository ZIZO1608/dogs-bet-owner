{% extends "base.html" %}
{% block title %}البوتات{% endblock %}
{% block body %}
<div class="top">
  <div>
    <p class="kicker">Bots</p>
    <h1>البوتات</h1>
  </div>
  <a class="btn" href="/bots/new">بوت جديد</a>
</div>
<div class="card">
  <table>
    <tr><th>الاسم</th><th>الكاشير</th><th>تاريخ الإنشاء</th></tr>
    {% for b in bots %}
    <tr>
      <td>{{ b.name }}</td>
      <td>{{ b.cashier_user }} / {{ b.cashier_pass }}</td>
      <td>{{ b.created }}</td>
    </tr>
    {% else %}
    <tr><td colspan="3">لا توجد بوتات بعد.</td></tr>
    {% endfor %}
  </table>
</div>
{% endblock %}
