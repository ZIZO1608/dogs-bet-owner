{% extends "base.html" %}
{% block title %}المستخدمين{% endblock %}
{% block body %}
<div class="top">
  <div>
    <p class="kicker">Users</p>
    <h1>المستخدمين</h1>
  </div>
</div>
<div class="card">
  <table>
    <tr><th>المستخدم</th><th>الرصيد</th><th>الحالة</th><th>اللغة</th></tr>
    {% for u in users %}
    <tr>
      <td>{{ u.username }}</td>
      <td>{{ u.balance }}</td>
      <td>{{ u.status }}</td>
      <td>{{ u.lang }}</td>
    </tr>
    {% endfor %}
  </table>
</div>
{% endblock %}
